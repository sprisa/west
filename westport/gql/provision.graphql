scalar Time

input ProvisionDeviceInput {
  token: String!
}

type LighthouseConfig {
  overlayIp: String!
  endpoint: String!
}

type ProvisionDeviceResponse {
  name: String!
  ca: String!
  cert: String!
  key: String!
  access_token: String!
  networkCipher: String!
  lighthouses: [LighthouseConfig!]!
}


type Mutation {
  provision_device(input: ProvisionDeviceInput!): ProvisionDeviceResponse!
}
